<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-charcoal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#F8FAFC" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="1.0" />
    </linearGradient>
    <filter id="paper-texture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.8  0 0 0 0 0.8  0 0 0 0 0.8  0 0 0 0.05 0" />
      <feComposite in2="SourceGraphic" in="gl" operator="in" />
    </filter>
  </defs>
  <rect width="800" height="1000" fill="url(#grad-charcoal)" />
  <rect width="800" height="1000" fill="#F8FAFC" filter="url(#paper-texture)" opacity="0.6" />
  
  <!-- Artistic Composition -->
  <g opacity="0.85" transform="translate(50, 40)">
    <ellipse cx="350" cy="420" rx="220" ry="300" fill="none" stroke="#1E293B" stroke-width="2.5" opacity="0.4" />
    <path d="M220,680 C260,520 310,380 370,280 C410,210 460,190 490,260 C530,340 480,480 430,620 C400,700 320,780 220,680 Z" fill="#475569" opacity="0.15" stroke="#1E293B" stroke-width="3" />
    <path d="M310,320 C340,240 400,210 430,260 C460,310 420,380 370,390 C320,400 290,360 310,320 Z" fill="none" stroke="#1E293B" stroke-width="4" />
    <path d="M370,390 C420,460 460,540 480,680 C440,710 390,720 330,690" fill="none" stroke="#64748B" stroke-width="3.5" stroke-dasharray="6 4" />
    <path d="M260,450 C310,480 380,470 440,430" fill="none" stroke="#1E293B" stroke-width="2" />
    <circle cx="370" cy="290" r="45" fill="#64748B" opacity="0.25" />
  </g>

  <!-- Editorial Signature watermark -->
  <g transform="translate(80, 920)">
    <text font-family="'Cormorant Garamond', Georgia, serif" font-size="24" font-style="italic" fill="#1E293B" opacity="0.7">Monks in Solitude</text>
    <text y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" letter-spacing="3" fill="#1E293B" opacity="0.45">SANJAY RAI (BANTAWA) ARCHIVE</text>
  </g>
</svg>